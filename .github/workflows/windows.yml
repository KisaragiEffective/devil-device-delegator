name: Git and OpenSSH compatibility
on:
  push:
    paths: ['windows/**', 'protocol/**', 'global.json', '.gitattributes', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'protocol/**', 'global.json', '.gitattributes', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Toolchain evidence
        run: |
          dotnet --info
          git --version
          ssh -V
      - name: Compatibility and P1 probes
        run: dotnet test windows/Ddd.slnx -c Release --tl:off --logger trx --results-directory artifacts/test-results
      - name: Publish production only (software signer excluded)
        if: runner.os == 'Windows'
        run: dotnet publish windows/src/Ddd.Windows/Ddd.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Published executable fails closed on unsupported invocation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./artifacts/windows/Ddd.Windows.exe -Y verify
          if ($LASTEXITCODE -ne 2) { throw 'Expected unsupported-invocation exit code 2' }
          exit 0
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7
